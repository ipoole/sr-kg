schema_version: 1
tutorials:
- tutorial_id: using-physicskg
  title: Using PhysicsKG
  category: interface
  summary: See how Selection, Context and the displayed graph work together.
  sequence: 10
  domains:
  - sr
  - math
  steps:
  - step_id: see-the-whole-map
    title: See the whole map
    commentary: PhysicsKG begins as a map of subject modules. Folded modules let you see the wood before the trees;
      Fit frames the displayed graph.
    prepare:
    - command: select
      target: module:sr.spacetime_foundations
    - command: set-all-module-representations
      value: folded
    - command: set-display-scope
      value: overview
    - command: set-view
      value: graph
    - command: set-context
      preset: derivation
      depth: one-hop
    action:
      command: fit
      value: displayed
    pointer:
      target: control:fit
  - step_id: select-a-module
    title: Select a module
    commentary: Modules organise the landscape into coherent subjects. Selecting SR-2 makes it the subject in the
      graph; Details follows the same selection.
    action:
      command: select
      target: module:sr.relativistic_mechanics
    pointer:
      target: graph:module:sr.relativistic_mechanics
  - step_id: choose-the-pane
    title: Choose what occupies the screen
    commentary: View chooses Graph, Details or Both. These actions demonstrate each; changing panes preserves the
      selection, graph mode and reading state.
    actions:
    - action:
        command: set-view
        value: details
      pointer:
        target: control:view
      pause_ms: 3000
    - action:
        command: set-view
        value: both
      pointer:
        target: control:view
      pause_ms: 3000
    - action:
        command: set-view
        value: graph
      pointer:
        target: control:view
  - step_id: reveal-the-concepts
    title: Reveal its concepts
    commentary: The plus control expands a module in place. Its concepts appear inside the same persistent area
      of the map. Fit selection then frames those concepts clear of this tutorial card.
    actions:
    - action:
        command: set-module-representation
        target: module:sr.relativistic_mechanics
        value: expanded
      pointer:
        target: control:module-fold:sr.relativistic_mechanics
    - action:
        command: fit
        value: selection
      pointer:
        target: control:fit
  - step_id: overview-across-subjects
    title: See the wood and the trees
    commentary: Overview combines open and folded modules. Here SR and Maths are expanded while GR stays folded.
      Derivation links connect concepts within each open module; between modules, summary links stop at the module boundaries.
      Module titles remain visible below their concepts.
    actions:
    - action:
        command: set-module-representation
        target: module:sr.spacetime_foundations
        value: expanded
      pointer:
        target: control:module-fold:sr.spacetime_foundations
    - action:
        command: set-module-representation
        target: module:sr.variational_and_field_theory
        value: expanded
      pointer:
        target: control:module-fold:sr.variational_and_field_theory
    - action:
        command: set-module-representation
        target: module:sr.electromagnetic_structure_gauge_and_stress_energy
        value: expanded
      pointer:
        target: control:module-fold:sr.electromagnetic_structure_gauge_and_stress_energy
    - action:
        command: set-module-representation
        target: module:sr.field_dynamics_conservation_and_radiation
        value: expanded
      pointer:
        target: control:module-fold:sr.field_dynamics_conservation_and_radiation
    - action:
        command: set-module-representation
        target: module:math.m01_manifolds_and_coordinates
        value: expanded
      pointer:
        target: control:module-fold:math.m01_manifolds_and_coordinates
    - action:
        command: set-module-representation
        target: module:math.m02_tensor_calculus
        value: expanded
      pointer:
        target: control:module-fold:math.m02_tensor_calculus
    - action:
        command: fit
        value: displayed
      pointer:
        target: control:fit
  - step_id: return-to-one-module
    title: Take a closer look
    commentary: Fit selection brings SR-2 back into view. Expanding other modules has not moved its concepts or changed
      the selection. Next, compare how the graph modes treat the same map.
    action:
      command: fit
      value: selection
    pointer:
      target: control:fit
  - step_id: choose-graph-emphasis
    title: Choose how the graph is treated
    commentary: Overview shows the whole map with internal concept links and module summaries. Context + background emphasises the selected context;
      Context only omits the background. Selecting something never changes this choice automatically.
    actions:
    - action:
        command: set-display-scope
        value: overview
      pointer:
        target: control:display-scope
      pause_ms: 3000
    - action:
        command: set-display-scope
        value: context
      pointer:
        target: control:display-scope
      pause_ms: 3000
    - action:
        command: set-display-scope
        value: full
      pointer:
        target: control:display-scope
  - step_id: preview-a-concept
    title: Preview without selecting
    commentary: On a pointer device, hovering over a concept previews it without changing Selection. PhysicsKG demonstrates
      that preview here.
    action:
      command: show-graph-concept-hover
      target: concept:sr.momentum_four_vector
    pointer:
      target: graph:concept:sr.momentum_four_vector
  - step_id: select-a-concept
    title: Select a concept
    commentary: Selection gives the viewer a subject. Here, momentum four-vector becomes the subject shown in the
      graph and Details.
    action:
      command: select
      target: concept:sr.momentum_four_vector
    pointer:
      target: graph:concept:sr.momentum_four_vector
  - step_id: choose-connections
    title: Choose a Context
    commentary: Context chooses which relationships to follow from the selection. Connections gives a broad one-hop
      neighbourhood.
    action:
      command: set-context
      preset: connections
      depth: one-hop
    pointer:
      target: control:context
  - step_id: show-the-context
    title: See the context clearly
    commentary: Context only hides the background graph while leaving the selected concept and its context visible.
    action:
      command: set-display-scope
      value: context
    pointer:
      target: control:display-scope
  - step_id: frame-the-result
    title: Frame the result
    commentary: Fit context adjusts the camera around the context without changing Selection, Context or the graph
      itself.
    action:
      command: fit
      value: context
    pointer:
      target: control:fit
  - step_id: preview-a-relationship
    title: Preview a relationship
    commentary: On a pointer device, hovering over an edge emphasises it and explains the relationship. On touch
      devices, tapping an edge opens its details.
    action:
      command: show-graph-edge-hover
      target: edge:sr.momentum_four_vector|DERIVES_FROM|sr.velocity_four_vector
    pointer:
      target: graph:edge:sr.momentum_four_vector|DERIVES_FROM|sr.velocity_four_vector
  - step_id: return-to-the-map
    title: Return to the full map
    commentary: Context + background restores the wider map. The same Selection and Context remain active, so changing
      this axis does not silently change them.
    action:
      command: set-display-scope
      value: full
    pointer:
      target: control:display-scope
  - step_id: search-for-lorentz-transformations
    title: Search across PhysicsKG
    commentary: Search finds concepts and modules by identifier, title or authored text. PhysicsKG enters this query
      and displays the matches.
    action:
      command: search
      query: Lorentz transformations
    pointer:
      target: control:search
  - step_id: choose-a-search-result
    title: Choose a result
    commentary: Selecting a search result changes Selection exactly as selecting its node in the graph would.
    action:
      command: select
      target: concept:sr.lorentz_transformations
    pointer:
      target: search:concept:sr.lorentz_transformations
  - step_id: inspect-details
    title: Read the Details
    commentary: Details develops the selected concept in authored blocks. Contents and folded headings help you
      move through a longer explanation.
    prepare:
    - command: close-search
    - command: set-view
      value: details
    action:
      command: open-details-block
      target: block:sr.lorentz_transformations.overview
    pointer:
      target: details:block:sr.lorentz_transformations.overview
  - step_id: inspect-a-derivation-tree
    title: Follow an idea back to its foundations
    commentary: Open Mass-energy equivalence and its Derived from section. Full tree includes earlier foundations
      as well as the immediate inputs. Read the explanations beside the links to see why each connection matters.
    actions:
    - action:
        command: select
        target: concept:sr.mass_energy_equivalence
      pointer:
        target: details:heading
    - action:
        command: open-details-relationship
        value: derived-from
      pointer:
        target: details:heading
    - action:
        command: set-relationship-full-tree
        value: derived-from
        full_tree: true
      pointer:
        target: details:derived-from-full-tree
  - step_id: show-the-derivation-in-graph
    title: Turn the reading into a graph
    commentary: Briefly show Both to see the reading and graph controls together. Choose Context only, then Show in graph.
      This shortcut sets Derivation and Transitive depth and
      fits the context automatically. Switch to Graph for more room, then fit again to frame the concepts.
    actions:
    - action:
        command: set-view
        value: both
      pointer:
        target: control:view
    - action:
        command: set-display-scope
        value: context
      pointer:
        target: control:display-scope
    - action:
        command: show-relationship-in-graph
        preset: derivation
        full_tree: true
      pointer:
        target: details:derived-from-show-graph
    - action:
        command: set-view
        value: graph
      pointer:
        target: control:view
    - action:
        command: fit
        value: context
      pointer:
        target: control:fit
  - step_id: show-a-derivation-tree
    title: Bring the tree together with Fit++
    commentary: After Fit context, the button becomes Fit++. Press it to bring the context concepts closer together.
      You can adjust these positions while exploring; navigating away restores the saved layout.
    action:
      command: fit
      value: context
    pointer:
      target: control:fit
  - step_id: continue-your-study
    title: Continue your study
    commentary: Tools contains study questions, reading progress, notes, layouts and portable personal data. This
      tutorial only points them out; it does not change your study record.
    action:
      command: show-tools-section
      value: study
    pointer:
      target: control:tools
