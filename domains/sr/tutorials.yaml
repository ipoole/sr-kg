  - step_id: read-opening-question
    title: One clock, two ticks
    commentary: Read the opening question. Keep the same two tick events in mind throughout
      the explanation.
    actions:
    - action:
        command: set-view
        value: details
      pause_ms: 0
      pointer:
        target: control:view
    - action:
        command: open-details-block
        target: block:sr.time_dilation.overview
      pause_ms: 500
      pointer:
        target: details:block:sr.time_dilation.overview
    demonstrate: false
  - step_id: define-the-comparison
    title: How does the lab assign time?
    commentary: Read One travelling clock and a lab clock network. Identify A and
      B, the clock that visits both, and the separate lab clocks that record them.
      Which frame synchronises those lab clocks?
    action:
      command: open-details-block
      target: block:sr.time_dilation.measurement
    pointer:
      target: details:block:sr.time_dilation.measurement
    demonstrate: false
  - step_id: build-a-light-clock
    title: Count returning light pulses
    commentary: Read the light-clock setup. Locate A and B on the lower mirror, and
      check why its own round-trip time is proper time.
    action:
      command: open-details-block
      target: block:sr.time_dilation.light_clock_setup
    pointer:
      target: details:block:sr.time_dilation.light_clock_setup
    demonstrate: false
  - step_id: compare-the-paths
    title: The same pulse in two frames
    commentary: Trace the graphic's vertical path in the clock frame and diagonal
      path in the lab. These are spatial paths inside the apparatus, not rays travelling
      to a distant observer. Find L and s.
    action:
      command: open-details-graphic
    pointer:
      target: details:graphic
    demonstrate: false
  - step_id: explain-the-diagonal
    title: Longer path, unchanged light speed
    commentary: Read A diagonal path at the same speed. Explain why the mirror moves
      during the flight, and why the lab cannot compensate by assigning a larger speed
      to the light.
    action:
      command: open-details-block
      target: block:sr.time_dilation.light_clock_triangle
    pointer:
      target: details:block:sr.time_dilation.light_clock_triangle
    demonstrate: false
  - step_id: derive-the-factor
    title: Let the triangle do the algebra
    commentary: Work through the right-triangle derivation. Identify the three sides
      before substituting for L, then check the result at zero speed.
    action:
      command: open-details-block
      target: block:sr.time_dilation.light_clock_derivation
    pointer:
      target: details:block:sr.time_dilation.light_clock_derivation
    demonstrate: false
  - step_id: interpret-the-clock-law
    title: Which interval is longer?
    commentary: Compare the definition with the derivation. Say which clock or frame
      each time symbol belongs to, and which interval is longer.
    action:
      command: open-details-block
      target: block:sr.time_dilation.definition
    pointer:
      target: details:block:sr.time_dilation.definition
    demonstrate: false
  - step_id: generalise-the-clock
    title: Does this only work for light clocks?
    commentary: Read why the comparison applies to ideal clocks generally. Distinguish
      a physical clock error from the effect of comparing measurements in different
      inertial frames.
    action:
      command: open-details-block
      target: block:sr.time_dilation.ideal_clocks
    pointer:
      target: details:block:sr.time_dilation.ideal_clocks
    demonstrate: false
  - step_id: put-numbers-on-it
    title: Ten seconds versus eight
    commentary: Work through the numerical example. Check both directions of the calculation,
      and distinguish a local second from the comparison of elapsed readings in two
      frames.
    action:
      command: open-details-block
      target: block:sr.time_dilation.worked_comparison
    pointer:
      target: details:block:sr.time_dilation.worked_comparison
    demonstrate: false
  - step_id: connect-the-lorentz-boost
    title: Find the same rule in Lorentz transformations
    commentary: Read the time part of the standard boost and the sentence about its
      inverse. Our clock is stationary in the primed frame; which displacement between
      its two ticks is zero there?
    actions:
    - action:
        command: select
        target: concept:sr.lorentz_transformations
      pause_ms: 500
      pointer:
        target: details:heading
    - action:
        command: open-details-block
        target: block:sr.lorentz_transformations.boost_formula
      pause_ms: 500
      pointer:
        target: details:block:sr.lorentz_transformations.boost_formula
    demonstrate: false
  - step_id: apply-the-boost
    title: Keep the clock's two events fixed
    commentary: Read Derivation from a boost. Follow the zero-displacement substitution
      and identify why primed coordinate time equals this clock's proper time.
    actions:
    - action:
        command: select
        target: concept:sr.time_dilation
      pause_ms: 500
      pointer:
        target: details:heading
    - action:
        command: open-details-block
        target: block:sr.time_dilation.lorentz_derivation
      pause_ms: 500
      pointer:
        target: details:block:sr.time_dilation.lorentz_derivation
    demonstrate: false
  - step_id: connect-proper-time
    title: Clock time belongs to a worldline
    commentary: Read Coordinate time versus clock time in Proper time. This generalises
      the distinction we used for two ticks of a coasting clock.
    actions:
    - action:
        command: select
        target: concept:sr.proper_time
      pause_ms: 500
      pointer:
        target: details:heading
    - action:
        command: open-details-block
        target: block:sr.proper_time.coordinate_time
      pause_ms: 500
      pointer:
        target: details:block:sr.proper_time.coordinate_time
    demonstrate: false
  - step_id: read-the-invariant-rate
    title: Recover the clock rate from the interval
    commentary: Follow the interval calculation. Identify where the clock's speed
      enters, and why the positive root gives a smaller elapsed proper time.
    action:
      command: open-details-block
      target: block:sr.proper_time.rate
    pointer:
      target: details:block:sr.proper_time.rate
    demonstrate: false
  - step_id: reunite-the-explanations
    title: Triangle, boost and interval agree
    commentary: Read The same result from proper time. Compare it with the light-clock
      triangle, and note the limit on applying a finite constant-speed formula to
      a changing journey.
