<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
<title>Electric and magnetic field readings under a transverse Lorentz boost</title>
<defs>
<marker id="electric" markerWidth="6" markerHeight="6"
        refX="4" refY="3.0" orient="auto"
        markerUnits="strokeWidth">
  <path d="M0,0 L4,3.0 L0,6 Z" fill="#2056b5"/>
</marker></defs>
<g font-family="Arial, sans-serif">
<text x="450.0" y="43.0" font-size="29" fill="#293f51" text-anchor="middle">One field, different electric and magnetic readings</text>
<rect x="20.0" y="80.0" width="420.0" height="390.0" rx="18.0" fill="#f8fbff" stroke="#cfdaea"/>
<text x="230.0" y="122.0" font-size="28" fill="#293f51" text-anchor="middle">S</text>
<line x1="135.0" y1="325.0" x2="300.0" y2="325.0" stroke="#63788a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="180.0" y1="345.0" x2="180.0" y2="140.0" stroke="#63788a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="180.0" y1="325.0" x2="180.0" y2="190.0" stroke="#2056b5" stroke-width="6" stroke-linecap="round" marker-end="url(#electric)"/>
<text x="210.0" y="200.0" font-size="30" fill="#2056b5" text-anchor="start">E</text>
<text x="230.0" y="413.0" font-size="25" fill="#293f51" text-anchor="middle">E = E₀; B = 0</text>
<text x="304.0" y="353.0" font-size="23" fill="#63788a" text-anchor="middle">x</text>
<text x="156.0" y="138.0" font-size="23" fill="#63788a" text-anchor="middle">y</text>
<rect x="460.0" y="80.0" width="420.0" height="390.0" rx="18.0" fill="#f8fbff" stroke="#cfdaea"/>
<text x="670.0" y="122.0" font-size="28" fill="#293f51" text-anchor="middle">S′ moving at +0.6c</text>
<line x1="575.0" y1="325.0" x2="740.0" y2="325.0" stroke="#63788a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="620.0" y1="345.0" x2="620.0" y2="140.0" stroke="#63788a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="620.0" y1="325.0" x2="620.0" y2="156.2" stroke="#2056b5" stroke-width="6" stroke-linecap="round" marker-end="url(#electric)"/>
<text x="650.0" y="166.2" font-size="30" fill="#2056b5" text-anchor="start">E′</text>
<text x="670.0" y="413.0" font-size="25" fill="#293f51" text-anchor="middle">E′ = 1.25E₀; cB′ = −0.75E₀</text>
<circle cx="775.0" cy="240.0" r="24.0" fill="none" stroke="#ae6b16" stroke-width="3"/>
<line x1="763.0" y1="228.0" x2="787.0" y2="252.0" stroke="#ae6b16" stroke-width="3" stroke-linecap="round"/>
<line x1="763.0" y1="252.0" x2="787.0" y2="228.0" stroke="#ae6b16" stroke-width="3" stroke-linecap="round"/>
<text x="775.0" y="304.0" font-size="22" fill="#ae6b16" text-anchor="middle">B′ into page</text>
<text x="744.0" y="353.0" font-size="23" fill="#63788a" text-anchor="middle">x′</text>
<text x="596.0" y="138.0" font-size="23" fill="#63788a" text-anchor="middle">y′</text>
<text x="450.0" y="530.0" font-size="29" fill="#293f51" text-anchor="middle">Both descriptions: E² − c²B² = E₀²</text>
</g>
</svg>
