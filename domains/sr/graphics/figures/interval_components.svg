<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
<title>Two frames give the same interval square for one fixed pair of events</title>
<defs></defs>
<g font-family="Arial, sans-serif">
<text x="450.0" y="43.0" font-size="30" fill="#293f51" text-anchor="middle">One event pair, two coordinate descriptions</text>
<rect x="20.0" y="76.0" width="420.0" height="405.0" rx="18.0" fill="#f8fbff" stroke="#cfdaea"/>
<text x="230.0" y="115.0" font-size="25" fill="#293f51" text-anchor="middle">S: Δct = 5 m, Δx = 3 m</text>
<line x1="110.0" y1="405.0" x2="365.0" y2="405.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="405.0" x2="110.0" y2="140.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="366.0" y="435.0" font-size="25" fill="#63788a" text-anchor="middle">x</text>
<text x="85.0" y="139.0" font-size="25" fill="#63788a" text-anchor="middle">ct</text>
<line x1="110.0" y1="405.0" x2="254.0" y2="165.0" stroke="#2056b5" stroke-width="5" stroke-linecap="round"/>
<circle cx="110.0" cy="405.0" r="7.0" fill="#bd443e"/>
<circle cx="254.0" cy="165.0" r="7.0" fill="#bd443e"/>
<text x="90.0" y="430.0" font-size="25" fill="#bd443e" text-anchor="middle">A</text>
<text x="274.0" y="155.0" font-size="25" fill="#bd443e" text-anchor="middle">B</text>
<text x="230.0" y="455.0" font-size="29" fill="#2056b5" text-anchor="middle">25 − 9 = 16 m²</text>
<rect x="460.0" y="76.0" width="420.0" height="405.0" rx="18.0" fill="#f8fbff" stroke="#cfdaea"/>
<text x="670.0" y="115.0" font-size="25" fill="#293f51" text-anchor="middle">S′: Δct′ = 4 m, Δx′ = 0</text>
<line x1="550.0" y1="405.0" x2="805.0" y2="405.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<line x1="550.0" y1="405.0" x2="550.0" y2="140.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="806.0" y="435.0" font-size="25" fill="#63788a" text-anchor="middle">x′</text>
<text x="525.0" y="139.0" font-size="25" fill="#63788a" text-anchor="middle">ct′</text>
<line x1="550.0" y1="405.0" x2="550.0" y2="213.0" stroke="#2056b5" stroke-width="5" stroke-linecap="round"/>
<circle cx="550.0" cy="405.0" r="7.0" fill="#bd443e"/>
<circle cx="550.0" cy="213.0" r="7.0" fill="#bd443e"/>
<text x="530.0" y="430.0" font-size="25" fill="#bd443e" text-anchor="middle">A</text>
<text x="570.0" y="203.0" font-size="25" fill="#bd443e" text-anchor="middle">B</text>
<text x="670.0" y="455.0" font-size="29" fill="#2056b5" text-anchor="middle">16 − 0 = 16 m²</text>
<text x="450.0" y="530.0" font-size="25" fill="#293f51" text-anchor="middle">A and B are unchanged. Their coordinate components are not.</text>
</g>
</svg>
