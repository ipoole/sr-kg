<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
<title>The same vector and covector pairing under a one-dimensional coordinate rescaling</title>
<defs>
<marker id="same-vector" markerWidth="6" markerHeight="6"
        refX="4" refY="3.0" orient="auto"
        markerUnits="strokeWidth">
  <path d="M0,0 L4,3.0 L0,6 Z" fill="#2056b5"/>
</marker></defs>
<g font-family="Arial, sans-serif">
<text x="450.0" y="42.0" font-size="30" fill="#293f51" text-anchor="middle">Change the component numbers, keep the readout</text>
<rect x="20.0" y="75.0" width="420.0" height="415.0" rx="18.0" fill="#f7faff" stroke="#ccdced"/>
<text x="230.0" y="118.0" font-size="28" fill="#293f51" text-anchor="middle">x coordinates</text>
<text x="230.0" y="176.0" font-size="36" fill="#2056b5" text-anchor="middle">V</text>
<line x1="100.0" y1="210.0" x2="370.0" y2="210.0" stroke="#2056b5" stroke-width="6" stroke-linecap="round" marker-end="url(#same-vector)"/>
<circle cx="100.0" cy="210.0" r="7.0" fill="#bd443e"/>
<text x="80.0" y="229.0" font-size="27" fill="#bd443e" text-anchor="middle">p</text>
<line x1="100.0" y1="285.0" x2="370.0" y2="285.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<line x1="100.0" y1="277.0" x2="100.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="100.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">0</text>
<line x1="190.0" y1="277.0" x2="190.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="190.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">1</text>
<line x1="280.0" y1="277.0" x2="280.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="280.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">2</text>
<line x1="370.0" y1="277.0" x2="370.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="370.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">3</text>
<text x="230.0" y="375.0" font-size="27" fill="#2056b5" text-anchor="middle">vector component: 3</text>
<text x="230.0" y="420.0" font-size="30" fill="#ae6b16" text-anchor="middle">ωₓ = 8</text>
<text x="230.0" y="464.0" font-size="28" fill="#293f51" text-anchor="middle">ω(V) = 8 × 3 = 24</text>
<rect x="460.0" y="75.0" width="420.0" height="415.0" rx="18.0" fill="#f7faff" stroke="#ccdced"/>
<text x="670.0" y="118.0" font-size="28" fill="#293f51" text-anchor="middle">x′ = 2x coordinates</text>
<text x="670.0" y="176.0" font-size="36" fill="#2056b5" text-anchor="middle">V</text>
<line x1="540.0" y1="210.0" x2="810.0" y2="210.0" stroke="#2056b5" stroke-width="6" stroke-linecap="round" marker-end="url(#same-vector)"/>
<circle cx="540.0" cy="210.0" r="7.0" fill="#bd443e"/>
<text x="520.0" y="229.0" font-size="27" fill="#bd443e" text-anchor="middle">p</text>
<line x1="540.0" y1="285.0" x2="810.0" y2="285.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<line x1="540.0" y1="277.0" x2="540.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="540.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">0</text>
<line x1="585.0" y1="277.0" x2="585.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="585.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">1</text>
<line x1="630.0" y1="277.0" x2="630.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="630.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">2</text>
<line x1="675.0" y1="277.0" x2="675.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="675.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">3</text>
<line x1="720.0" y1="277.0" x2="720.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="720.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">4</text>
<line x1="765.0" y1="277.0" x2="765.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="765.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">5</text>
<line x1="810.0" y1="277.0" x2="810.0" y2="293.0" stroke="#63788a" stroke-width="2" stroke-linecap="round"/>
<text x="810.0" y="324.0" font-size="25" fill="#63788a" text-anchor="middle">6</text>
<text x="670.0" y="375.0" font-size="27" fill="#2056b5" text-anchor="middle">vector component: 6</text>
<text x="670.0" y="420.0" font-size="30" fill="#ae6b16" text-anchor="middle">ωₓ′ = 4</text>
<text x="670.0" y="464.0" font-size="28" fill="#293f51" text-anchor="middle">ω(V) = 4 × 6 = 24</text>
<text x="450.0" y="528.0" font-size="24" fill="#63788a" text-anchor="middle">The new basis unit is half as large; its covector readout halves too.</text>
</g>
</svg>
