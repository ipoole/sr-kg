<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
<title>Stationary clocks compare the same light pulses with different proper-time rates</title>
<defs><marker id="signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b56d12"/></marker></defs>
<g font-family="Arial, sans-serif">
<text x="450.00" y="42.00" text-anchor="middle" font-size="30" fill="#273d50">Count pulses using each local clock</text>
<text x="240.00" y="92.00" text-anchor="middle" font-size="27" fill="#273d50">A: lower potential</text>
<text x="660.00" y="92.00" text-anchor="middle" font-size="27" fill="#273d50">B: higher potential</text>
<line x1="240.00" y1="130.00" x2="240.00" y2="435.00" stroke="#879bad" stroke-width="3" stroke-linecap="round" />
<line x1="660.00" y1="130.00" x2="660.00" y2="435.00" stroke="#879bad" stroke-width="3" stroke-linecap="round" />
<line x1="92.00" y1="432.00" x2="92.00" y2="160.00" stroke="#617487" stroke-width="3" stroke-linecap="round" />
<text x="92.00" y="142.00" text-anchor="middle" font-size="27" fill="#617487">t</text>
<text x="240.00" y="461.00" text-anchor="middle" font-size="24" fill="#2056b5">fewer clock ticks</text>
<text x="660.00" y="461.00" text-anchor="middle" font-size="24" fill="#2056b5">more clock ticks</text>
<line x1="225.00" y1="200.00" x2="255.00" y2="200.00" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="225.00" y1="250.00" x2="255.00" y2="250.00" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="225.00" y1="300.00" x2="255.00" y2="300.00" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="225.00" y1="350.00" x2="255.00" y2="350.00" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="225.00" y1="400.00" x2="255.00" y2="400.00" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="645.00" y1="140.00" x2="675.00" y2="140.00" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="645.00" y1="173.33" x2="675.00" y2="173.33" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="645.00" y1="206.67" x2="675.00" y2="206.67" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="645.00" y1="240.00" x2="675.00" y2="240.00" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="645.00" y1="273.33" x2="675.00" y2="273.33" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="645.00" y1="306.67" x2="675.00" y2="306.67" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="645.00" y1="340.00" x2="675.00" y2="340.00" stroke="#2056b5" stroke-width="3" stroke-linecap="round" />
<line x1="240.00" y1="400.00" x2="660.00" y2="340.00" stroke="#b56d12" stroke-width="4" stroke-linecap="round" marker-end="url(#signal-arrow)"/>
<circle cx="240.00" cy="400.00" r="7" fill="#b56d12"/>
<circle cx="660.00" cy="340.00" r="7" fill="#b56d12"/>
<line x1="240.00" y1="300.00" x2="660.00" y2="240.00" stroke="#b56d12" stroke-width="4" stroke-linecap="round" marker-end="url(#signal-arrow)"/>
<circle cx="240.00" cy="300.00" r="7" fill="#b56d12"/>
<circle cx="660.00" cy="240.00" r="7" fill="#b56d12"/>
<line x1="240.00" y1="200.00" x2="660.00" y2="140.00" stroke="#b56d12" stroke-width="4" stroke-linecap="round" marker-end="url(#signal-arrow)"/>
<circle cx="240.00" cy="200.00" r="7" fill="#b56d12"/>
<circle cx="660.00" cy="140.00" r="7" fill="#b56d12"/>
<text x="450.00" y="510.00" text-anchor="middle" font-size="25" fill="#273d50">The same pulse intervals span more receiver clock ticks.</text>
<text x="450.00" y="549.00" text-anchor="middle" font-size="23" fill="#617487">Lower received frequency; the clock-rate difference is exaggerated.</text>
</g>
</svg>
