<text x="450.00" y="518.00" text-anchor="middle" font-size="25" fill="#617487">Each row: relative acceleration along one spatial axis</text>
<text x="450.00" y="552.00" text-anchor="middle" font-size="22" fill="#617487">Arbitrary common units; these are instantaneous maps, not histories.</text>
