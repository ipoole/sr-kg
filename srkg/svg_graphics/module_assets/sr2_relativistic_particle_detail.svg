<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SR-2 Relativistic Particle Mechanics detail graphic</title>
  <desc id="desc">A massive particle moves along a proper-time worldline, carrying four-velocity and energy-momentum.</desc>
  <defs>
    <radialGradient id="particle" cx="38%" cy="32%" r="66%">
      <stop offset="0" stop-color="#fff3b0"/><stop offset=".42" stop-color="#e0a51c"/><stop offset="1" stop-color="#9a6100"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f6c34a" stop-opacity=".4"/><stop offset="1" stop-color="#f6c34a" stop-opacity="0"/></radialGradient>
    <marker id="axis" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 8 5 0 10Z" fill="#555"/></marker>
    <marker id="momentum" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 8 5 0 10Z" fill="#248a3d"/></marker>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="54" fill="#fbfcff" stroke="#dbe3f3" stroke-width="3"/>
  <path d="M79 438V67M79 438H447" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round" marker-end="url(#axis)" opacity=".68"/>
  <path d="M256 66 439 256 256 448 73 256" fill="#edf3ff" fill-opacity=".6" stroke="#1f4fbf" stroke-width="3" stroke-dasharray="8 8" opacity=".7"/>
  <path d="M120 438C128 356 178 327 240 280S358 190 386 69" fill="none" stroke="#1f4fbf" stroke-width="11" stroke-linecap="round"/>
  <g stroke="#222" stroke-width="4" stroke-linecap="round">
    <path d="M144 376 123 365"/><path d="M178 337 159 320"/><path d="M220 301 202 280"/>
    <path d="M264 264 246 242"/><path d="M307 225 289 205"/><path d="M345 181 323 166"/><path d="M372 126 348 118"/>
  </g>
  <circle cx="267" cy="259" r="66" fill="url(#halo)"/>
  <circle cx="267" cy="259" r="27" fill="url(#particle)" stroke="#222" stroke-width="4"/>
  <circle cx="258" cy="249" r="7" fill="#fff9d7" opacity=".9"/>
  <path d="M284 242 411 133" fill="none" stroke="#248a3d" stroke-width="10" stroke-linecap="round" marker-end="url(#momentum)"/>
  <path d="M278 249 352 189" fill="none" stroke="#c78a00" stroke-width="4" stroke-linecap="round" opacity=".75"/>
  <g font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-style="italic">
    <text x="90" y="78" font-size="27" fill="#555">ct</text><text x="430" y="467" font-size="27" fill="#555">x</text>
    <text x="384" y="116" font-size="31" fill="#248a3d">p<tspan baseline-shift="super" font-size="68%">μ</tspan></text>
    <text x="317" y="187" font-size="24" fill="#9a6100">u<tspan baseline-shift="super" font-size="68%">μ</tspan></text>
    <text x="137" y="400" font-size="25" fill="#222">τ</text>
  </g>
  <g transform="translate(321 325)">
    <rect x="0" y="0" width="139" height="96" rx="18" fill="#fff" stroke="#c8c8c8" stroke-width="3"/>
    <text x="69.5" y="34" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="24" fill="#222">p<tspan baseline-shift="super" font-size="68%">μ</tspan> = (E/c, p)</text>
    <path d="M19 49H120" stroke="#d8d8d8" stroke-width="2"/>
    <text x="69.5" y="78" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="18" fill="#8a5d00">E<tspan baseline-shift="super" font-size="68%">2</tspan> = p<tspan baseline-shift="super" font-size="68%">2</tspan>c<tspan baseline-shift="super" font-size="68%">2</tspan> + m<tspan baseline-shift="super" font-size="68%">2</tspan>c<tspan baseline-shift="super" font-size="68%">4</tspan></text>
  </g>
</svg>
